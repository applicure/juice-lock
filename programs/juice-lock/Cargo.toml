[package]
name = "juice-lock"
version = "0.1.0"
description = "Juice LP locks: PumpSwap LP tokens locked for a fixed time, withdrawable only by their owner after it"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "juice_lock"

[features]
default = []
# Build for devnet: the devnet program id and the soak durations (state.rs:
# every duration divided by 1,440). Without it the build is the mainnet build.
devnet = []
# MAINNET-TEST build: the mainnet build with "1 week" = 1 day (state.rs
# TIER0_SECS), nothing else changed. Deployed first for a 1-day mainnet test,
# then upgraded to the default build before the revoke. Never with `devnet`.
mainnet-test = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2" }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022"] }
solana-security-txt = "=1.1.3"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
